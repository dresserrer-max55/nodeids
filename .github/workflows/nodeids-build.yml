name: Build Node IDs 2.2091 (Android64)

# Compila geode.node-ids (geode-sdk/NodeIDs) para Android64 y GD 2.2091. Mismo esquema que globed-build.yml:
# SDK v6 + bindings fijadas, loader compilado para enlazar.

on:
  workflow_dispatch:
    inputs:
      mod_repo:
        description: 'Repo del mod (owner/repo)'
        default: 'geode-sdk/NodeIDs'
      mod_ref:
        description: 'Rama, tag o commit (vacio = rama por defecto)'
        default: ''
  push:
    branches:
      - "**"

env:
  GD_VERSION: "2.2091"
  GD_COMP_VERSION: "22091"
  GEODE_REF: "v6"
  BINDINGS_REF: "5326138"
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm-cache

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de Node IDs
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.mod_repo || 'geode-sdk/NodeIDs' }}
          ref: ${{ inputs.mod_ref || '' }}
          path: mod_src

      - name: Apuntar mod.json a GD 2.2091
        shell: bash
        run: |
          cd mod_src
          python3 - <<'PY'
          import os, re
          v = os.environ["GD_VERSION"]
          s = open("mod.json", encoding="utf-8").read()
          n = re.sub(r'("android(?:32|64)?"\s*:\s*)"[^"]*"', r'\1"%s"' % v, s)
          open("mod.json", "w", encoding="utf-8").write(n)
          print(re.search(r'"gd"\s*:\s*\{[^}]*\}', n).group(0))
          PY

      - name: Parchear fuentes de Node IDs para las bindings de 2.2091
        shell: bash
        run: |
          python3 - mod_src <<'PY'
          import sys, re, glob, os
          root = sys.argv[1]
          def edit(rel, pairs):
              path = f"{root}/{rel}"
              if not os.path.isfile(path):
                  print("NO EXISTE", rel); return
              t = open(path, encoding="utf-8").read(); n = t
              for a, b in pairs:
                  if a not in n: print("  (no encontrado en", rel, "):", a[:50].replace("\n", " "))
                  n = n.replace(a, b)
              if n != t:
                  open(path, "w", encoding="utf-8").write(n); print("parcheado", rel)

          # gd::string ya no existe
          for f in glob.glob(f"{root}/src/*.cpp") + glob.glob(f"{root}/src/*.hpp"):
              t = open(f, encoding="utf-8").read()
              if "gd::string" in t:
                  open(f, "w", encoding="utf-8").write(t.replace("gd::string", "std::string")); print("gd::string ->", f)

          # firmas distintas en 2.2091
          t = open(f"{root}/src/CustomSongWidget.cpp", encoding="utf-8").read()
          t = re.sub(r"int unk\s*\n(\s*)\) \{", r"int unk, bool unkBool2, bool unkBool3\n\1) {", t, count=1)
          t = re.sub(r"\bunk\s*\n(\s*)\)\) \{", r"unk, unkBool2, unkBool3\n\1)) {", t, count=1)
          open(f"{root}/src/CustomSongWidget.cpp", "w", encoding="utf-8").write(t)
          edit("src/FriendRequestPopup.cpp", [("bool init(GJFriendRequest* request) {", "bool init(GJFriendRequest* request, bool b) {"),
                                              ("FriendRequestPopup::init(request)", "FriendRequestPopup::init(request, b)")])
          edit("src/PlayLayer.cpp", [("bool init(GJGameLevel* level, bool useReplay, bool dontCreateObjects) {", "bool init(GJGameLevel* level, bool dontCreateObjects) {"),
                                     ("PlayLayer::init(level, useReplay, dontCreateObjects)", "PlayLayer::init(level, dontCreateObjects)")])

          # clases cuyos miembros son privados / no existen en las bindings de Android 2.2091 (layout desconocido):
          # se omiten para no escribir en offsets incorrectos
          for f in ("GJUserCell.cpp", "InfoLayer.cpp", "LevelInfoLayer.cpp"):
              p = f"{root}/src/{f}"
              if os.path.isfile(p):
                  os.remove(p); print("omitido", f)
          PY

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Geode CLI profile
        run: |
          CLI_PROFILE="$GITHUB_WORKSPACE/cli-profile"
          mkdir -p "$CLI_PROFILE/geode/mods"
          geode profile add --name GithubActions "$CLI_PROFILE/GeometryDash.exe" win

      - name: Clone Geode SDK (${{ env.GEODE_REF }})
        run: |
          git clone --depth 1 --branch "$GEODE_REF" --recurse-submodules --shallow-submodules \
            https://github.com/geode-sdk/geode "$GITHUB_WORKSPACE/geode-sdk-clone"
          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk-clone" >> "$GITHUB_ENV"
          git -C geode-sdk-clone log -1 --format='Geode %h %ad %s' --date=short
          grep -n "android:" geode-sdk-clone/CMakeLists.txt | head -2

      # Las bindings de geode-sdk/bindings (main) estan en obras para 2.209x y a veces quedan rotas entre commits
      # (el 21-oct el commit 7229495 quito miembros de EditorPauseLayer y dejo su inline sin actualizar).
      # Se fija un commit conocido que compila y se usa en el loader y en el mod.
      - name: Clonar bindings (commit fijo)
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/geode-sdk/bindings "$GITHUB_WORKSPACE/bindings-clone"
          git -C "$GITHUB_WORKSPACE/bindings-clone" checkout "$BINDINGS_REF"
          git -C "$GITHUB_WORKSPACE/bindings-clone" log -1 --format='bindings %h %ad %s' --date=short
          echo "GEODE_BINDINGS_REPO_PATH=$GITHUB_WORKSPACE/bindings-clone" >> "$GITHUB_ENV"

      # El mod se enlaza contra Geode.android64.so: se compila el loader de la misma rama.
      # (Directorio de build distinto de "build": el CMake del mod usa $GEODE_SDK/build para el SDK.)
      - name: Build Geode loader (link target)
        shell: bash
        run: |
          set -o pipefail
          NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          [ -d "$NDK" ] || NDK="$ANDROID_NDK_LATEST_HOME"
          cd "$GEODE_SDK"
          cmake -B loader-build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DANDROID_PLATFORM=android-23 -DANDROID_STL=c++_shared -DANDROID_ABI=arm64-v8a \
            -DGEODE_BINDINGS_REPO_PATH="$GEODE_BINDINGS_REPO_PATH" \
            -DGEODE_GD_VERSION="$GD_VERSION" -DGEODE_COMP_GD_VERSION="$GD_COMP_VERSION" 2>&1 | tee "$GITHUB_WORKSPACE/loader.log"
          cmake --build loader-build --parallel -- -k 0 2>&1 | tee -a "$GITHUB_WORKSPACE/loader.log"
          ls -la bin/nightly/Geode.android64.so

      - name: Errores del loader (resumen)
        if: ${{ failure() }}
        shell: bash
        run: |
          {
            echo "## Errores al compilar el loader"
            echo '```'
            grep -n -B1 -A12 -E 'FAILED:|error:|CMake Error|undefined reference|ld: error|fatal error' loader.log | head -150
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Diagnostico de asp2 (CPM)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "SDK: $(git -C geode-sdk-clone log -1 --format='%h %ad %s' --date=short)"
          grep -n 'GEODE_ASP_VERSION "' geode-sdk-clone/CMakeLists.txt || true
          ls cpm-cache/asp2 || true
          ls cpm-cache/asp2/*/include/asp/fs/Path.hpp || echo "FALTA asp/fs/Path.hpp en asp2"

      - name: Ajustar la version de Geode en mod.json a la del SDK
        shell: bash
        run: |
          V=$(tr -d '[:space:]' < "$GEODE_SDK/VERSION")
          echo "Version del SDK: $V"
          sed -i -E "s/(\"geode\"[[:space:]]*:[[:space:]]*)\"[^\"]*\"/\1\"$V\"/" mod_src/mod.json
          grep -n '"geode"' mod_src/mod.json

      - name: Build mod
        shell: bash
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          [ -d "$NDK" ] || NDK="$ANDROID_NDK_LATEST_HOME"
          cd mod_src
          set +e
          {
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_STL=c++_shared -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 \
              -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=Android64 \
              -DGEODE_GD_VERSION="$GD_VERSION" -DGEODE_COMP_GD_VERSION="$GD_COMP_VERSION" \
              -DGEODE_BINDINGS_REPO_PATH="$GEODE_BINDINGS_REPO_PATH" \
            && cmake --build build --config Release --parallel -- -k 0
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## Error compilando Node IDs"
              echo '```'
              grep -E '^/.*(error|fatal error):|CMake Error|undefined reference|ld: error' "$GITHUB_WORKSPACE/build.log" | sed 's|/home/runner/work/[^/]*/[^/]*/||' | sort -u | cut -c1-260 | head -250
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit $code
          fi
          mkdir -p "$GITHUB_WORKSPACE/output"
          find ./build -name "*.geode" -exec cp {} "$GITHUB_WORKSPACE/output/" \;
          ls -la "$GITHUB_WORKSPACE/output"

      - name: Upload build logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nodeids-build-logs
          path: |
            build.log
            loader.log
          if-no-files-found: ignore

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: nodeids-android64-2.2091
          path: |
            output/geode.node-ids.geode
            mod_src/build/geode.node-ids.geode
          if-no-files-found: error
          
